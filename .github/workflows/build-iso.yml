# =============================================================================
# build-iso.yml — Generate a bootable Anaconda ISO from the container image
# =============================================================================
name: Build ISO

on:
  workflow_dispatch:
    inputs:
      rootfs:
        description: 'Root filesystem for the ISO'
        required: false
        default: 'btrfs'
        type: choice
        options:
          - btrfs
          - ext4
          - xfs
      types:
        description: 'Artifact types to build'
        required: false
        default: 'anaconda-iso'
        type: string
  schedule:
    - cron: '0 6 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull container image
        run: |
          podman pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Create output directory
        run: mkdir -p ./output

      - name: Build ISO
        run: |
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v ./config.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type ${{ github.event.inputs.types || 'anaconda-iso' }} \
            --rootfs ${{ github.event.inputs.rootfs || 'btrfs' }} \
            --local \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: List ISO output
        run: |
          find ./output -type f -exec ls -lh {} \;

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-45-macbookair-iso
          path: ./output
          if-no-files-found: error
          retention-days: 30

      - name: ISO summary
        run: |
          echo "### ISO Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Rootfs: \`${{ github.event.inputs.rootfs || 'btrfs' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the ISO from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
